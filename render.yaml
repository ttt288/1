services:
  - type: web
    name: adaptive-decision-agent
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_QUERY_UNDERSTANDING_ENABLED
        value: "true"
      - key: LLM_WEB_SEARCH_ENABLED
        value: "true"
      - key: LLM_MAX_INPUT_PRODUCTS
        value: "8"
      - key: LLM_TIMEOUT_SECONDS
        value: "25"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "300"
